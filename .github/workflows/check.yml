name: Check

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Build and verify committed artifacts
        run: |
          node annotations/build.mjs
          git diff --exit-code -- annotations/main.js annotations/styles.css annotations/examples/ theme.css
      - name: Test annotations
        run: node --test annotations/tests/*.test.cjs tests/native/*.test.cjs
      - name: Test installer and distribution exporter
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Verify release packages
        run: python3 scripts/package.py
